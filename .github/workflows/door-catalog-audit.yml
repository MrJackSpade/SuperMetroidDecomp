name: Static door catalog audit

on:
  push:
    paths: ['csharp/src/SuperMetroid.Core/**', 'csharp/src/SuperMetroid.ResourceAudit/**', '.github/workflows/door-catalog-audit.yml']
  pull_request:
    paths: ['csharp/src/SuperMetroid.Core/**', 'csharp/src/SuperMetroid.ResourceAudit/**', '.github/workflows/door-catalog-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doors:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Confirm catalog omission detection
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release -- --door-catalog-self-check .
      - name: Audit independently bounded door lists (no ROM or gameplay)
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release --no-build -- --door-catalog-audit . out/door-catalog-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: door-catalog-audit
          path: out/door-catalog-audit.json
          if-no-files-found: error
