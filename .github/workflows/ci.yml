name: CI

# One run per change to main or a pull request. Tags run only the release workflow, other branches run nothing,
# and a newer push cancels the run it supersedes.
on:
  push:
    branches: [main]
    paths: ['csharp/**', 'tools/frame-definitions-generator/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['csharp/**', 'tools/frame-definitions-generator/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-policy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      # #142: the ordinary build fails on every gated diagnostic in maintained source.
      - name: Build every maintained desktop project
        run: dotnet build csharp/SuperMetroid.slnx -c Debug
      - name: Confirm each gated diagnostic fails a plain build
        run: dotnet run --project csharp/src/SuperMetroid.BuildPolicyVerification -c Debug --no-build

  # Whole-solution dead-code gate: fails on any unreachable or unreferenced symbol, serialization-only
  # member, or shipped symbol only tools reach.
  reachability:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Build the solution
        run: dotnet build csharp/SuperMetroid.Full.slnx -c Release
      # Dead code is not checked here: the asynchronous cleanup (tools/cleanup) prunes it after every push and pushes the
      # result, so it never blocks a push (owner ruling, 2026-11-11).
      # A flagged owner, locator, context bag or large class is justified on the type or fails, and so does a Core module
      # cycle. Stale inventories and stale reviews do not fail here: the asynchronous cleanup (tools/cleanup) fixes them.
      - name: Architecture audit (every finding justified at its site)
        run: dotnet run --project csharp/src/SuperMetroid.ArchitectureAudit -c Release --no-build -- --solution csharp/SuperMetroid.Full.slnx --findings

  # The spawned-object and enemy-definition frame tables AssetExtraction installs are generated from Core's call graph.
  # A Core change that moves what a spawner spawns, made without regenerating, leaves the installed sheets holding the
  # wrong frames; the generator's check fails the run while the committed tables differ from its output (#1852).
  frame-definitions:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Build Core, which the generator loads as a Release workspace
        run: dotnet build csharp/src/SuperMetroid.Core/SuperMetroid.Core.csproj -c Release
      - name: Confirm the generated frame tables match the generator
        run: dotnet run --project tools/frame-definitions-generator -c Release -- --check

  enemy-visuals:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Confirm omission detection
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release -- --enemy-visual-audit-self-check
      - name: Audit all compiled enemy visual programs (no ROM or gameplay)
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release --no-build -- --enemy-visual-program-audit . out/enemy-visual-program-audit.json
      # The audit's own contract fixtures hard-code type shapes and source paths; run them on every push so a refactor
      # that moves what they reference is caught at once (#1645 found SamusArtworkPresentationContractChecks stale).
      - name: Resource audit contract self-check
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release --no-build -- --self-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: enemy-visual-program-audit
          path: out/enemy-visual-program-audit.json
          if-no-files-found: warn
