name: Build quality gates

on:
  workflow_dispatch:
  push:
    paths: ['csharp/**', '.github/workflows/build-policy.yml']
  pull_request:
    paths: ['csharp/**', '.github/workflows/build-policy.yml']

permissions:
  contents: read

jobs:
  build-policy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      # #142: the ordinary build fails on every gated diagnostic in maintained source.
      - name: Build every maintained desktop project
        run: dotnet build csharp/SuperMetroid.slnx -c Debug
      - name: Confirm each gated diagnostic fails a plain build
        run: dotnet run --project csharp/src/SuperMetroid.BuildPolicyVerification -c Debug --no-build
