; Super Metroid C# playable-host settings
; This file belongs beside your private .smc/.sfc cartridge image.

[Game]
; true  = keep title/file select/options, then go directly to the Ceres elevator
; false = play the narration, flashbacks, and Ceres approach before the elevator
SkipOpeningCinematic=true
; true allows damage but prevents Samus from dropping below 1 energy
; also lets shinesparks continue at low energy, draining down to 1
; false preserves normal cartridge damage and death behavior
Invincibility=true
; true allows normal consumption but keeps unlocked ammo types at 1 or more
; false preserves normal cartridge ammunition behavior
InfiniteAmmo=true
; Count down normally in Ceres and after Mother Brain, then hold at 00:01.00
PreventEscapeTimeout=true
; None = normal save/map-station visibility
; Public = temporarily reveal everything an ordinary map station exposes
; Secret = temporarily reveal every valid map cell, including hidden cells
MapReveal=Secret

[Audio]
; Enables the cartridge SPC sequencer, BRR samples, DSP mixing, and playback
Enabled=true
; Final host gain after SNES mixing; integer from 0 through 100
MasterVolumePercent=100

[Diagnostics]
; true files recoverable runtime errors through the authenticated GitHub CLI
; repeated errors share a stable fingerprint and never create duplicate issues
ReportErrorsToGitHub=true
; Private repository in owner/name form; no ROM contents are attached
GitHubErrorRepository=MrJackSpade/SuperMetroidDecomp
