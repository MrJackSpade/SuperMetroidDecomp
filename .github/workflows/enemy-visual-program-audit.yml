name: Static enemy visual program audit

on:
  push:
    paths: ['csharp/src/SuperMetroid.Core/**', 'csharp/src/SuperMetroid.AssetExtraction/**', 'csharp/src/SuperMetroid.Tooling/**', 'csharp/src/SuperMetroid.ResourceAudit/**', '.github/workflows/enemy-visual-program-audit.yml']
  pull_request:
    paths: ['csharp/src/SuperMetroid.Core/**', 'csharp/src/SuperMetroid.AssetExtraction/**', 'csharp/src/SuperMetroid.Tooling/**', 'csharp/src/SuperMetroid.ResourceAudit/**', '.github/workflows/enemy-visual-program-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enemy-visuals:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Confirm omission detection
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release -- --enemy-visual-audit-self-check
      - name: Audit all compiled enemy visual programs (no ROM or gameplay)
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release --no-build -- --enemy-visual-program-audit . out/enemy-visual-program-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: enemy-visual-program-audit
          path: out/enemy-visual-program-audit.json
          if-no-files-found: warn
