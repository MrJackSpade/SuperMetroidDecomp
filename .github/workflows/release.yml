name: Tagged release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN: ${{ github.run_number }}
        run: python tools/release.py version
      - run: python -m unittest discover -s tests -p 'test_release.py'

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify ROM-independent import validation
        run: dotnet run --project csharp/src/SuperMetroid.AssetExtractionVerification -c Release
      - name: Publish self-contained desktop
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish csharp/src/SuperMetroid.Game -c Release -r win-x64 --self-contained true -p:Version=$env:RELEASE_VERSION -o out/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item csharp/ROM-SETUP.md out/windows/ROM-SETUP.md
          python tools/release.py package-windows out/windows out/artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: out/artifacts/*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload and SDK components
        run: |
          dotnet workload install android
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build csharp/src/SuperMetroid.Android -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory=$env:ANDROID_HOME -p:JavaSdkDirectory=$env:JAVA_HOME -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_CODE: ${{ needs.version.outputs.code }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: pwsh -File tools/build-release-android.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: out/artifacts/*.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: out/artifacts
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python tools/release.py publish out/artifacts
      - name: Announce release in Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          DISCORD_RELEASES_CHANNEL_ID: ${{ vars.DISCORD_RELEASES_CHANNEL_ID }}
        run: python tools/release.py notify
