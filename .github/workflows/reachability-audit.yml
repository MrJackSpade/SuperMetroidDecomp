name: Reachability audit

# Whole-solution dead-code gate: fails on any unreachable or unreferenced symbol, serialization-only
# member, or shipped symbol only tools reach, unless the (empty) allow-list names it.
on:
  push:
    paths: ['csharp/**', '.github/workflows/reachability-audit.yml']
  pull_request:
    paths: ['csharp/**', '.github/workflows/reachability-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # The analyzer compiles every project, including the Android host.
      - name: Install Android workload and SDK components
        run: |
          dotnet workload install android
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build csharp/src/SuperMetroid.Android -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory=$env:ANDROID_HOME -p:JavaSdkDirectory=$env:JAVA_HOME -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the solution
        run: dotnet build csharp/SuperMetroid.Full.slnx -c Release
      - name: Fail on dead code (empty allow-list)
        run: dotnet run --project csharp/src/SuperMetroid.ReachabilityAudit -c Release --no-build -- --solution csharp/SuperMetroid.Full.slnx --check csharp/src/SuperMetroid.ReachabilityAudit/reachability-allow-list.txt --output out/reachability
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reachability-audit
          path: out/reachability
          if-no-files-found: warn
