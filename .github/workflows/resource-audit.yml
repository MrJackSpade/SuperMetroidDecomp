name: Static resource audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Confirm audit contracts
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release -- --self-check
      - name: Audit static resource dependencies (no ROM or gameplay)
        run: dotnet run --project csharp/src/SuperMetroid.ResourceAudit -c Release --no-build -- --root . --json out/resource-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-resource-audit
          path: out/resource-audit.json
          if-no-files-found: warn
